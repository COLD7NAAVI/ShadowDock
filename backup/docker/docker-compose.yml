name: shadowdock

services:
  postgres:
    image: postgres:17-alpine
    container_name: shadowdock-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shadowdock}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d shadowdock"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
